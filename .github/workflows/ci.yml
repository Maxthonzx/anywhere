name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bash syntax and regression tests
        shell: bash
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
          python -m unittest discover -s tests -v
      - name: Platform installer tests
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\test-windows.ps1

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check scripts
        run: shellcheck -x scripts/*.sh
